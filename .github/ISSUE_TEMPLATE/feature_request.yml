name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from a user or developer perspective?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or “none yet”.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Primary STEEL surface
      options:
        - Desk
        - Studio / MIDI / racks
        - Hosts
        - OLED / console
        - Audit / JWT / permissions
        - Auth
        - CI / tooling
        - Docs / community
        - Cross-cutting / platform
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or related issues.
    validations:
      required: false
